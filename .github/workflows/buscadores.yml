# Search engines and AI assistants (ChatGPT, Claude, Perplexity...).
#
# - On every push, to any branch: llms.txt must match the pages it is
#   built from (.github/scripts/llms.mjs --check). A red cross here means
#   "run `node .github/scripts/llms.mjs` and commit llms.txt".
# - After GitHub Pages publishes main: request the live home page as each
#   AI crawler (fails if Cloudflare blocks one) and ping IndexNow so Bing
#   picks up the changes the same day (.github/scripts/avisar-buscadores.mjs).
#
# Needs no secrets. It never changes the repository.
name: Buscadores

# Not `workflow_run` on "pages build and deployment": that one is GitHub's
# built-in Pages workflow, it has no file in the repo, and workflow_run
# never fires for it (checked on 14/10/2026, the first publish). So the
# ping runs on the push to main and waits for Pages to finish instead.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llms-al-dia:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/llms.mjs --check

  avisar-buscadores:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pages takes about a minute to build and publish, and it sits behind
      # Cloudflare and a CDN cache: give the new version time to be the one
      # that answers.
      - run: sleep 150
      - run: node .github/scripts/avisar-buscadores.mjs
