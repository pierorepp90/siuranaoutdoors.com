<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
// Only an explicit ES/EN choice (stored by the language toggle) redirects.
// Guessing from the browser language is what Google asks sites not to do:
// Googlebot crawls without Accept-Language and mostly from the US, so it
// would be bounced off the Spanish pages. First-time visitors whose browser
// is in the other language get a suggestion bar instead (main.js).
(function () {
  var pref = null;
  try { pref = localStorage.getItem('siuranaLang'); } catch (e) {}
  var onEnglishPage = window.location.pathname.indexOf('/en/') === 0;
  if (pref === 'en' && !onEnglishPage) { window.location.replace('/en/order/'); }
  if (pref === 'es' && onEnglishPage) { window.location.replace('/pedido/'); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Tu pedido — Siurana Outdoors</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/css/style.css?v=20260930">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo-link" href="/"><img class="logo" src="/assets/img/logo.jpg" alt="Siurana Outdoors"></a>
    <div class="header-right">
      <a class="lang-toggle" href="/en/order/" onclick="localStorage.setItem('siuranaLang','en')" onmousedown="localStorage.setItem('siuranaLang','en')" lang="en" aria-label="Switch to English">EN</a>
    </div>
  </div>
</header>

<section class="order">
  <div class="container">
    <a class="back-link" href="/">‹ Volver a la tienda</a>
    <h1 class="section-title">Tu pedido</h1>
    <p class="body-text">Bolsa de magnesio Siurana Outdoors — 250g, 8€ la unidad.</p>

    <form id="order-form" novalidate>
      <div class="order-block" style="border-top:none; padding-top:0; margin-top:0;">
        <h2 class="section-title" style="font-size:16px;">Tus datos</h2>
        <div class="field-row">
          <div class="field">
            <label for="first-name">Nombre*</label>
            <input type="text" id="first-name" required>
          </div>
          <div class="field">
            <label for="last-name">Apellido*</label>
            <input type="text" id="last-name" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="phone">Teléfono*</label>
            <input type="tel" id="phone" required>
          </div>
          <div class="field">
            <label for="email">Email*</label>
            <input type="email" id="email" required>
          </div>
        </div>
      </div>

      <div class="order-block">
        <h2 class="section-title" style="font-size:16px;">Cantidad</h2>
        <div class="qty-stepper">
          <button type="button" class="qty-btn" id="qty-minus" aria-label="Restar una unidad">−</button>
          <input type="number" id="qty" min="1" max="10" value="1" inputmode="numeric" aria-label="Cantidad">
          <button type="button" class="qty-btn" id="qty-plus" aria-label="Sumar una unidad">+</button>
        </div>
      </div>

      <div class="order-block">
        <h2 class="section-title" style="font-size:16px;">Entrega</h2>
        <label class="radio-option">
          <input type="radio" name="delivery" id="delivery-shipping" checked>
          Envío a domicilio <span class="fee-note">(+2,99€)</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="delivery" id="delivery-pickup">
          Comprar en nuestros puntos de venta
        </label>

        <div class="field" id="address-field">
          <label for="address">Dirección* (calle, número, código postal)</label>
          <textarea id="address" rows="2" required></textarea>
        </div>

        <div class="field" id="pickup-field" hidden>
          <label for="pickup-point">Punto de venta*</label>
          <select id="pickup-point">
            <option value="">Elige un punto</option>
            <option value="Gavà">Gavà</option>
            <option value="Barcelona (Poble Nou)">Barcelona (Poble Nou)</option>
          </select>
        </div>

        <div class="store-map" id="store-map" hidden>
          <a class="store-map-link" id="store-map-link" href="#" target="_blank" rel="noopener">
            <img id="store-map-img" alt="" width="1040" height="700">
          </a>
          <p class="store-map-name" id="store-map-name"></p>
          <p class="store-map-address" id="store-map-address"></p>
          <p class="store-map-note">Pásate por la tienda y cómpralo allí.</p>
          <a class="store-map-directions" id="store-map-directions" href="#" target="_blank" rel="noopener">Cómo llegar</a>
        </div>
      </div>

      <div id="checkout-part">

      <div class="order-block">
        <h2 class="section-title" style="font-size:16px;">Método de pago</h2>
        <label class="radio-option">
          <input type="radio" name="payment" id="payment-card" checked>
          Tarjeta
        </label>
        <label class="radio-option">
          <input type="radio" name="payment" id="payment-bizum">
          Bizum
        </label>
      </div>

      <p class="order-total" aria-live="polite">Total: <strong id="order-total">8€</strong></p>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFHWcdulpkmsGeOQ" data-appearance="interaction-only" data-action="order" data-language="es"></div>
      <button type="submit" class="btn-base" id="submit-order">Tramitar pedido</button>
      <p class="order-error" id="order-error" hidden></p>
      <p class="order-confirmation" id="order-confirmation" hidden></p>
      </div>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 Siurana Outdoors · <a href="/privacidad/">Aviso legal y privacidad</a></p>
  </div>
</footer>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="/assets/js/meta.js?v=20260930"></script>
<script src="/assets/js/main.js?v=20260930"></script>
</body>
</html>
