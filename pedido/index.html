<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
(function () {
  var pref = localStorage.getItem('siuranaLang');
  var onEnglishPage = window.location.pathname.indexOf('/en/') === 0;
  var wantsEnglish;
  if (pref) {
    wantsEnglish = pref === 'en';
  } else {
    var browserLang = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
    wantsEnglish = browserLang.indexOf('en') === 0;
  }
  if (wantsEnglish && !onEnglishPage) { window.location.replace('/en/order/'); }
  if (!wantsEnglish && onEnglishPage) { window.location.replace('/pedido/'); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu pedido — Siurana Outdoors</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <img class="logo" src="/assets/img/logo.jpg" alt="Siurana Outdoors">
    <div class="header-right">
      <a class="lang-toggle" href="/en/order/" onclick="localStorage.setItem('siuranaLang','en')" onmousedown="localStorage.setItem('siuranaLang','en')" lang="en" aria-label="Switch to English">EN</a>
    </div>
  </div>
</header>

<section class="order">
  <div class="container">
    <a class="back-link" href="/">‹ Volver a la tienda</a>
    <h1 class="section-title">Tu pedido</h1>
    <p class="body-text">Bolsa de magnesio Siurana Outdoors — 250g, 8€ la unidad.</p>

    <form id="order-form" novalidate>
      <div class="order-block" style="border-top:none; padding-top:0; margin-top:0;">
        <h2 class="section-title" style="font-size:16px;">Tus datos</h2>
        <div class="field-row">
          <div class="field">
            <label for="first-name">Nombre*</label>
            <input type="text" id="first-name" required>
          </div>
          <div class="field">
            <label for="last-name">Apellido*</label>
            <input type="text" id="last-name" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="phone">Teléfono*</label>
            <input type="tel" id="phone" required>
          </div>
          <div class="field">
            <label for="email">Email*</label>
            <input type="email" id="email" required>
          </div>
        </div>
      </div>

      <div class="order-block">
        <h2 class="section-title" style="font-size:16px;">Cantidad</h2>
        <div class="qty-stepper">
          <button type="button" class="qty-btn" id="qty-minus" aria-label="Restar una unidad">−</button>
          <input type="number" id="qty" min="1" max="10" value="1" inputmode="numeric" aria-label="Cantidad">
          <button type="button" class="qty-btn" id="qty-plus" aria-label="Sumar una unidad">+</button>
        </div>
      </div>

      <div class="order-block">
        <h2 class="section-title" style="font-size:16px;">Entrega</h2>
        <label class="radio-option">
          <input type="radio" name="delivery" id="delivery-shipping" checked>
          Envío a domicilio <span class="fee-note">(+2,99€)</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="delivery" id="delivery-pickup">
          Recoger en nuestros puntos de venta
        </label>

        <div class="field" id="address-field">
          <label for="address">Dirección* (calle, número, código postal)</label>
          <textarea id="address" rows="2" required></textarea>
        </div>

        <div class="field" id="pickup-field" hidden>
          <label for="pickup-point">Punto de recogida*</label>
          <select id="pickup-point">
            <option value="">Elige un punto</option>
            <option value="Gavà">Gavà</option>
            <option value="Barcelona (Poble Nou)">Barcelona (Poble Nou)</option>
            <option value="Barcelona (Rocafort)">Barcelona (Rocafort)</option>
          </select>
        </div>
      </div>

      <div class="order-block">
        <h2 class="section-title" style="font-size:16px;">Método de pago</h2>
        <label class="radio-option">
          <input type="radio" name="payment" id="payment-card" checked>
          Tarjeta
        </label>
        <label class="radio-option">
          <input type="radio" name="payment" id="payment-bizum">
          Bizum
        </label>
        <label class="radio-option">
          <input type="radio" name="payment" id="payment-cash">
          Efectivo (retiro en tienda)
        </label>
      </div>

      <p class="order-total" aria-live="polite">Total: <strong id="order-total">8€</strong></p>

      <button type="submit" class="btn-base" id="submit-order">Tramitar pedido</button>
      <p class="order-error" id="order-error" hidden></p>
      <p class="order-confirmation" id="order-confirmation" hidden></p>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 Siurana Outdoors</p>
  </div>
</footer>

<script src="/assets/js/main.js"></script>
</body>
</html>
